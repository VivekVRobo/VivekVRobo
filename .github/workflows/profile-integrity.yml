name: Profile Integrity

on:
  push:
    paths:
      - README.md
      - tools/check_profile_links.py
      - .github/workflows/profile-integrity.yml
  pull_request:
    paths:
      - README.md
      - tools/check_profile_links.py
      - .github/workflows/profile-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate profile portfolio links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_profile_links.py
