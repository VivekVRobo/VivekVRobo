  <title id="title">Vivek Vala — Robotics, Autonomous Systems and Embedded Intelligence</title>
  <desc id="desc">Premium GitHub profile banner with clean engineering typography, a believable desktop robotic arm, and restrained SLAM and embedded systems cues.</desc>
