  <circle cx="208" cy="169" r=".8"/><circle cx="236" cy="202" r="1"/><circle cx="268" cy="173" r=".9"/><circle cx="296" cy="225" r=".8"/><circle cx="326" cy="195" r="1"/><circle cx="352" cy="236" r=".8"/><circle cx="391" cy="179" r="1"/><circle cx="418" cy="218" r=".9"/><circle cx="452" cy="190" r="1"/><circle cx="493" cy="228" r=".8"/><circle cx="523" cy="191" r="1"/>
